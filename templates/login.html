<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie – Tygodniowy raport napraw GORT</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem 2.25rem;
            width: min(92vw, 400px);
        }
        .login-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: .4rem;
        }
        .login-title .gort { color: #4f9cf9; }
        label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: .35rem;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: #0d1726;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font: inherit;
            padding: .6rem .75rem;
            margin-bottom: 1.1rem;
            transition: border-color .15s;
        }
        input:focus { outline: none; border-color: #4f9cf9; }
        .btn-login {
            width: 100%;
            padding: .75rem;
            background: #22d3ee;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: .25rem;
            transition: background .15s;
        }
        .btn-login:hover { background: #67e8f9; }
        .error {
            background: #450a0a;
            color: #f87171;
            border: 1px solid #f87171;
            border-radius: 6px;
            padding: .5rem .75rem;
            font-size: .875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-title">
            ⚡ Tygodniowy raport napraw&nbsp;<span class="gort">GORT</span>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" autocomplete="on">
            <label>Login</label>
            <input type="text" name="login" autofocus autocomplete="username" required>
            <label>Hasło</label>
            <input type="password" name="password" autocomplete="current-password" required>
            <button type="submit" class="btn-login">Zaloguj się</button>
        </form>
    </div>
</body>
</html>
