<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie – Tygodniowy raport napraw DUR</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f3f6f8;
            color: #1f2933;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #ffffff;
            border: 1px solid #d5dde5;
            border-radius: 8px;
            padding: 2rem 2.25rem;
            width: min(92vw, 400px);
        }
        .login-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1f2933;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: .4rem;
        }
        .login-title svg { width: 20px; height: 20px; flex-shrink: 0; }
        .login-title .gort { color: #1f2933; }
        label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: #667085;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: .35rem;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d5dde5;
            border-radius: 6px;
            color: #1f2933;
            font: inherit;
            padding: .6rem .75rem;
            margin-bottom: 1.1rem;
            transition: border-color .15s;
        }
        input:focus { outline: none; border-color: #1769aa; box-shadow: 0 0 0 3px rgba(23,105,170,.15); }
        .btn-login {
            width: 100%;
            padding: .75rem;
            background: #1769aa;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: .25rem;
            transition: background .15s;
        }
        .btn-login:hover { background: #12588f; }
        .error {
            background: #fef0ef;
            color: #b42318;
            border: 1px solid #e7a8a3;
            border-radius: 6px;
            padding: .5rem .75rem;
            font-size: .875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 2h4v2.2c.7.2 1.4.5 2 .9l1.9-1.1 2 3.5-1.9 1.1a6 6 0 0 1 0 2.8l1.9 1.1-2 3.5-1.9-1.1c-.6.4-1.3.7-2 .9V18h-4v-2.2c-.7-.2-1.4-.5-2-.9l-1.9 1.1-2-3.5 1.9-1.1a6 6 0 0 1 0-2.8L4.1 7.5l2-3.5L8 5.1c.6-.4 1.3-.7 2-.9V2z" transform="translate(0 2)"/>
                <circle cx="12" cy="12" r="2.5"/>
            </svg>
            Tygodniowy raport napraw&nbsp;<span class="gort">DUR</span>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" autocomplete="on">
            <label>Login</label>
            <input type="text" name="login" autofocus autocomplete="username">
            <label>Hasło</label>
            <input type="password" name="password" autocomplete="current-password">
            <button type="submit" class="btn-login">Zaloguj się</button>
        </form>
        <p style="text-align:center;font-size:.76rem;color:#667085;margin-top:1rem;">Zostaw pola puste, aby uzyskać dostęp tylko do odczytu.</p>
    </div>
</body>
</html>
