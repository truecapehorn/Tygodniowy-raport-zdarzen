<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie – Tygodniowy raport zdarzen DUR</title>
    <script>
        (() => {
            let theme;
            try { theme = localStorage.getItem('dur-theme'); } catch (_) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 2h4v2.2c.7.2 1.4.5 2 .9l1.9-1.1 2 3.5-1.9 1.1a6 6 0 0 1 0 2.8l1.9 1.1-2 3.5-1.9-1.1c-.6.4-1.3.7-2 .9V18h-4v-2.2c-.7-.2-1.4-.5-2-.9l-1.9 1.1-2-3.5 1.9-1.1a6 6 0 0 1 0-2.8L4.1 7.5l2-3.5L8 5.1c.6-.4 1.3-.7 2-.9V2z" transform="translate(0 2)"/>
                <circle cx="12" cy="12" r="2.5"/>
            </svg>
            DUR - Tygodniowy raport zdarzen
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" autocomplete="on">
            <label>Login</label>
            <input type="text" name="login" autofocus autocomplete="username">
            <label>Hasło</label>
            <input type="password" name="password" autocomplete="current-password">
            <button type="submit" class="btn-login">Zaloguj się</button>
        </form>
        <p class="u-text-align-center u-font-size-76rem u-color-667085 u-margin-top-1rem">Zostaw pola puste, aby uzyskać dostęp tylko do odczytu.</p>
    </div>
</body>
</html>
