{% extends "base.html" %}
{% block title %}Zmień hasło – Tygodniowy raport napraw GORT{% endblock %}
{% block content %}
<div class="page-title">Zmień hasło <small>Aktualizacja danych logowania</small></div>
<div class="card" style="max-width:440px;">
    <div class="card-title">Zmiana hasła</div>
    <form method="post">
        <div class="field" style="margin-bottom:.75rem;">
            <label>Obecne hasło</label>
            <input type="password" name="current_password" required autocomplete="current-password">
        </div>
        <div class="field" style="margin-bottom:.75rem;">
            <label>Nowe hasło</label>
            <input type="password" name="new_password" required autocomplete="new-password" minlength="4">
        </div>
        <div class="field" style="margin-bottom:.75rem;">
            <label>Potwierdź nowe hasło</label>
            <input type="password" name="confirm_password" required autocomplete="new-password" minlength="4">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Zmień hasło</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
